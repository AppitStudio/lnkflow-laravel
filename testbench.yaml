laravel: '@testbench'

providers:
  # The package under development is not installed into vendor/, so Composer
  # package discovery cannot find it. The workbench app must load it explicitly
  # or `composer serve` boots without any LnkFlow config, commands, or the
  # <x-lnkflow-script /> component.
  - LnkFlow\Laravel\LnkFlowServiceProvider
  # - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
